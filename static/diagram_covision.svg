<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="100%" height="100%" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2A2926"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#FF5722"/>
    </marker>
    <filter id="card-shadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Outer Chassis Background -->
  <rect x="0" y="0" width="1120" height="390" rx="12" fill="#ECE8DF" stroke="#C8C2B4" stroke-width="2"/>

  <!-- Top Header Bar -->
  <rect x="16" y="14" width="1088" height="34" rx="6" fill="#181818"/>
  <circle cx="34" cy="31" r="6" fill="#FF5722"/>
  <text x="50" y="36" fill="#F4F1EA" font-size="12" font-weight="700" letter-spacing="1.2">LIVEPULSE ARCHITECTURE // REAL-TIME SCREEN CO-VISION &amp; HYBRID STRATEGY C</text>
  <text x="1088" y="36" fill="#9E9A90" font-size="11" text-anchor="end">1 FPS SMART DIFF + 1280p INSTANT VOICE/LASER HD</text>

  <!-- SUBGRAPH 1: BROWSER FRONTEND -->
  <rect x="16" y="60" width="525" height="314" rx="8" fill="#F7F4EC" stroke="#B8B2A4" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="30" y="82" fill="#5A564E" font-size="11" font-weight="700" letter-spacing="1">MOD. 1 // BROWSER FRONTEND (WEBRTC + CANVAS 60 FPS)</text>

  <!-- Node: getDisplayMedia -->
  <g filter="url(#card-shadow)">
    <rect x="30" y="98" width="210" height="64" rx="6" fill="#FFFFFF" stroke="#2A2926" stroke-width="1.5"/>
    <text x="135" y="122" fill="#181818" font-size="12" font-weight="700" text-anchor="middle">getDisplayMedia()</text>
    <text x="135" y="140" fill="#666259" font-size="10.5" text-anchor="middle">Live Screen / Window / Tab</text>
    <text x="135" y="154" fill="#1F9D55" font-size="9.5" font-weight="700" text-anchor="middle">● WEBRTC VIDEO STREAM</text>
  </g>

  <!-- Node: Hold Left-Click Laser -->
  <g filter="url(#card-shadow)">
    <rect x="30" y="180" width="210" height="68" rx="6" fill="#FFF7F4" stroke="#FF5722" stroke-width="1.5"/>
    <text x="135" y="203" fill="#D84315" font-size="11.5" font-weight="700" text-anchor="middle">🎯 Orange Laser Pointer</text>
    <text x="135" y="220" fill="#5A564E" font-size="10" text-anchor="middle">Hold Left-Click (mousedown)</text>
    <text x="135" y="236" fill="#FF5722" font-size="9.5" font-weight="700" text-anchor="middle">#FF5722 Crosshair + Halo</text>
  </g>

  <!-- Node: UI1 Dedicated Monitor -->
  <g filter="url(#card-shadow)">
    <rect x="280" y="98" width="244" height="64" rx="6" fill="#181818" stroke="#2A2926" stroke-width="1.5"/>
    <text x="402" y="122" fill="#F4F1EA" font-size="11.5" font-weight="700" text-anchor="middle">UI1 Dedicated Monitor</text>
    <text x="402" y="140" fill="#A8A49B" font-size="10" text-anchor="middle">MOD. B #screenMonitorCanvas</text>
    <text x="402" y="154" fill="#FF5722" font-size="9.5" font-weight="700" text-anchor="middle">60 FPS COMPOSITED PREVIEW</text>
  </g>

  <!-- Node: Smart Diff Engine -->
  <g filter="url(#card-shadow)">
    <rect x="280" y="180" width="244" height="68" rx="6" fill="#FFFFFF" stroke="#2A2926" stroke-width="1.5"/>
    <text x="402" y="203" fill="#181818" font-size="11.5" font-weight="700" text-anchor="middle">Smart Diff Engine (1 FPS)</text>
    <text x="402" y="220" fill="#5A564E" font-size="10" text-anchor="middle">64×36 luminance grid delta</text>
    <text x="402" y="236" fill="#1F9D55" font-size="9.5" font-weight="700" text-anchor="middle">Delta &gt;= 1.0% → 1024p JPEG</text>
  </g>

  <!-- Node: Instant HD Trigger -->
  <g filter="url(#card-shadow)">
    <rect x="30" y="268" width="494" height="86" rx="6" fill="#FFF7F4" stroke="#FF5722" stroke-width="1.8"/>
    <text x="277" y="292" fill="#D84315" font-size="12" font-weight="700" text-anchor="middle">⚡ Instant High-Definition Trigger (Strategy C — 1280p JPEG @ 0.88)</text>
    <text x="277" y="313" fill="#2A2926" font-size="10.5" text-anchor="middle">Triggered immediately on:  🎙️ Speech Start (Mic RMS &gt; 0.022)  |  🎯 Laser Pointer Click  |  ⌨️ Text Send</text>
    <text x="277" y="334" fill="#666259" font-size="10" text-anchor="middle">Injects crystal-clear 1280p frame with burned-in laser reticle right as you ask your question</text>
  </g>

  <!-- Arrows inside Browser -->
  <line x1="240" y1="130" x2="274" y2="130" stroke="#2A2926" stroke-width="1.8" marker-end="url(#arrow-dark)"/>
  <path d="M 240 214 L 260 214 L 260 144 L 274 144" fill="none" stroke="#FF5722" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <line x1="402" y1="162" x2="402" y2="174" stroke="#2A2926" stroke-width="1.8" marker-end="url(#arrow-dark)"/>

  <!-- SUBGRAPH 2: FASTAPI BRIDGE -->
  <rect x="564" y="60" width="286" height="314" rx="8" fill="#F7F4EC" stroke="#B8B2A4" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="578" y="82" fill="#5A564E" font-size="11" font-weight="700" letter-spacing="1">MOD. 2 // FASTAPI BRIDGE (app.py)</text>

  <!-- Node: POST /api/live/send -->
  <g filter="url(#card-shadow)">
    <rect x="582" y="128" width="250" height="78" rx="6" fill="#FFFFFF" stroke="#2A2926" stroke-width="1.5"/>
    <text x="707" y="154" fill="#181818" font-size="12" font-weight="700" text-anchor="middle">POST /api/live/send</text>
    <text x="707" y="173" fill="#5A564E" font-size="10.5" text-anchor="middle">Payload: { type: "image_in" }</text>
    <text x="707" y="191" fill="#1F9D55" font-size="9.5" font-weight="700" text-anchor="middle">IAP + ORIGIN + SIZE VERIFIED</text>
  </g>

  <!-- Node: session.send_realtime_input -->
  <g filter="url(#card-shadow)">
    <rect x="582" y="246" width="250" height="84" rx="6" fill="#181818" stroke="#2A2926" stroke-width="1.5"/>
    <text x="707" y="272" fill="#F4F1EA" font-size="11.5" font-weight="700" text-anchor="middle">google-genai Live SDK</text>
    <text x="707" y="292" fill="#FFB74D" font-size="10" text-anchor="middle">session.send_realtime_input(</text>
    <text x="707" y="308" fill="#FFB74D" font-size="10" text-anchor="middle">video=Blob(image/jpeg))</text>
  </g>

  <!-- Arrows Browser -> FastAPI Bridge -->
  <path d="M 524 214 L 554 214 L 554 158 L 576 158" fill="none" stroke="#2A2926" stroke-width="1.8" marker-end="url(#arrow-dark)"/>
  <path d="M 524 311 L 554 311 L 554 182 L 576 182" fill="none" stroke="#FF5722" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="707" y1="206" x2="707" y2="240" stroke="#2A2926" stroke-width="1.8" marker-end="url(#arrow-dark)"/>

  <!-- SUBGRAPH 3: VERTEX AI GEMINI LIVE -->
  <rect x="872" y="60" width="232" height="314" rx="8" fill="#F7F4EC" stroke="#B8B2A4" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="886" y="82" fill="#5A564E" font-size="11" font-weight="700" letter-spacing="1">MOD. 3 // VERTEX AI LIVE</text>

  <!-- Node: Vertex AI Gemini Live -->
  <g filter="url(#card-shadow)">
    <rect x="888" y="138" width="200" height="192" rx="8" fill="#181818" stroke="#FF5722" stroke-width="2"/>
    <text x="988" y="170" fill="#FF5722" font-size="12.5" font-weight="700" text-anchor="middle">Vertex AI Gemini Live</text>
    <text x="988" y="192" fill="#F4F1EA" font-size="10.5" font-weight="700" text-anchor="middle">Multimodal Full-Duplex</text>
    <line x1="908" y1="206" x2="1068" y2="206" stroke="#333333" stroke-width="1"/>
    <text x="988" y="226" fill="#D5D1C8" font-size="10" text-anchor="middle">• gemini-3.8-live-preview</text>
    <text x="988" y="244" fill="#FFB74D" font-size="10" font-weight="700" text-anchor="middle">• 3.8-live-thinking-preview</text>
    <text x="988" y="262" fill="#D5D1C8" font-size="10" text-anchor="middle">• gemini-3.8-live</text>
    <text x="988" y="280" fill="#D5D1C8" font-size="10" text-anchor="middle">• gemini-3.5-live-preview</text>
    <text x="988" y="308" fill="#1F9D55" font-size="10" font-weight="700" text-anchor="middle">🔊 24 kHz AUDIO + SEARCH</text>
  </g>

  <!-- Arrow FastAPI -> Vertex AI -->
  <path d="M 832 288 L 860 288 L 860 234 L 882 234" fill="none" stroke="#FF5722" stroke-width="2.2" marker-end="url(#arrow-orange)"/>
</svg>
